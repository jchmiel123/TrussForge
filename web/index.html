<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TrussForge</title>
<link rel="stylesheet" href="vendor/forgekit/forgekit.css">
<link rel="stylesheet" href="vendor/forgekit/forgekit.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="brand">Truss<span>Forge</span><em id="ver">v0.12.0</em></div>
    <input id="projName" class="projName" maxlength="64" spellcheck="false" autocomplete="off" title="Project name - click to rename. Save stores it on the server under this name." value="Untitled">
    <div class="group">
      <button id="runBtn" class="accent" title="Run / pause the simulation (Space)">Run</button>
      <button id="resetBtn" title="Put everything back in the build pose (R)">Reset</button>
    </div>
    <div class="group">
      <button id="undoBtn" class="icon" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M6 3 L2.5 6.5 L6 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 6.5 H9.5 A3.5 3.5 0 0 1 9.5 13.5 H6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="redoBtn" class="icon" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3 L13.5 6.5 L10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 6.5 H6.5 A3.5 3.5 0 0 0 6.5 13.5 H10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="pasteBtn" class="icon" title="Paste the copied structure (Ctrl+V)" aria-label="Paste" disabled>
        <svg viewBox="0 0 16 16" width="16" height="16"><rect x="3" y="3.5" width="10" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="5.5" y="1.8" width="5" height="3" rx="1" fill="currentColor"/><path d="M5.5 8 H10.5 M5.5 11 H9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="group">
      <button id="snapBtn" class="icon active" title="Grid snap on/off (G). Grid type, pitch and brightness: Grid button" aria-label="Grid snap">
        <svg viewBox="0 0 16 16" width="16" height="16"><g fill="currentColor"><circle cx="3" cy="3" r="1.3"/><circle cx="8" cy="3" r="1.3"/><circle cx="13" cy="3" r="1.3"/><circle cx="3" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="13" cy="8" r="1.3"/><circle cx="3" cy="13" r="1.3"/><circle cx="8" cy="13" r="1.3"/><circle cx="13" cy="13" r="1.3"/></g></svg>
      </button>
      <button id="gravBtn" class="icon active" title="Gravity on/off" aria-label="Gravity">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 2 V10 M4.5 7 L8 10.5 L11.5 7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 13.5 H13.5" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button id="followBtn" class="icon" title="Camera follows the structure" aria-label="Follow">
        <svg viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="8" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><path d="M8 1 V3.5 M8 12.5 V15 M1 8 H3.5 M12.5 8 H15" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button id="strainBtn" class="icon" title="Force view: red = tension, blue = compression (F)" aria-label="Force view">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M3.5 8 H12.5 M3.5 8 L6 5.5 M3.5 8 L6 10.5 M12.5 8 L10 5.5 M12.5 8 L10 10.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="worldBtn" title="World settings: gravity, friction, drag, sim speed (saved with the build)">World</button>
      <button id="gridBtn" title="View: theme, grid lattice, pitch, brightness (this device, not saved with the build)">View</button>
    </div>
    <div class="group right">
      <button id="saveBtn" class="accent2" title="Save to the server under the project name (Ctrl+S). Falls back to a file download if the server is unreachable.">Save</button>
      <button id="openBtn" title="Builds on the server, or open / download a file (Ctrl+O)">Open</button>
      <input type="file" id="openFile" accept=".json,application/json" style="display:none">
      <select id="demoSel" title="Load a demo build (your current build stays in Undo)">
        <option value="">Demo...</option>
        <option value="walker">Walker</option>
        <option value="hopper">Hopper</option>
        <option value="bridge">Bridge</option>
        <option value="merry">Merry-go-round</option>
        <option value="chain">Chain</option>
      </select>
      <button id="clearBtn" title="Clear the board (Undo brings it back)">Clear</button>
    </div>
  </header>
  <div id="main">
    <aside id="palette">
      <div class="palItem active" data-tool="select" title="Select / move (V)">
        <svg viewBox="0 0 22 22" width="22" height="22"><path d="M5 2.5 L17.5 11 L11.7 12.3 L14.8 18.6 L12.3 19.9 L9.2 13.6 L5 17 Z" fill="currentColor"/></svg>
        <div class="lbl">Select</div>
      </div>
      <div class="palItem" data-tool="group" title="Group: drag a box to select several nodes, then copy / mirror / move them (M)">
        <svg viewBox="0 0 22 22" width="22" height="22"><rect x="3.5" y="3.5" width="15" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 2.2"/><circle cx="8.5" cy="8.5" r="1.8" fill="currentColor"/><circle cx="14" cy="13.5" r="1.8" fill="currentColor"/></svg>
        <div class="lbl">Group</div>
      </div>
      <div class="palItem" data-tool="weld" title="Weld: tap a node to weld / unweld it, tap a beam to put a welded hub in it, drag a node onto another to merge them (W)">
        <svg viewBox="0 0 22 22" width="22" height="22"><path d="M3 11 H19" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><rect x="7.5" y="7.5" width="7" height="7" rx="1.5" fill="currentColor"/><path d="M11 3 V7 M11 15 V19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <div class="lbl">Weld</div>
      </div>
      <div class="palItem" data-tool="node" title="Place nodes (N). Tap on a beam to put a welded hub in it.">
        <svg viewBox="0 0 22 22" width="22" height="22"><circle cx="11" cy="11" r="4" fill="currentColor"/></svg>
        <div class="lbl">Node</div>
      </div>
      <div class="palItem" data-tool="beam" title="Beam: rigid stick. Drag from anywhere - nodes are made as needed; start or end on a line to weld a hub into it (B)">
        <svg viewBox="0 0 22 22" width="22" height="22"><path d="M4 18 L18 4" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
        <div class="lbl">Beam</div>
      </div>
      <div class="palItem" data-tool="spring" title="Spring: stretchy, stiffness + damping (S)">
        <svg viewBox="0 0 22 22" width="22" height="22"><path d="M3 19 L6 16 L8 18 L10 14 L12 16 L14 12 L16 14 L19 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <div class="lbl">Spring</div>
      </div>
      <div class="palItem" data-tool="actuator" title="Actuator: a muscle - its length follows a wave (A)">
        <svg viewBox="0 0 22 22" width="22" height="22"><path d="M4 18 L9 13 M13 9 L18 4" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/><rect x="8.4" y="8.4" width="5.2" height="5.2" rx="1.2" fill="currentColor"/></svg>
        <div class="lbl">Actuator</div>
      </div>
      <div class="palItem" data-tool="chain" title="Chain: drag to lay a run of links (one per grid pitch). Sags, swings, wraps over solid members (C)">
        <svg viewBox="0 0 22 22" width="22" height="22"><g fill="none" stroke="currentColor" stroke-width="1.9"><rect x="1.5" y="8" width="8" height="6" rx="3"/><rect x="7" y="8" width="8" height="6" rx="3"/><rect x="12.5" y="8" width="8" height="6" rx="3"/></g></svg>
        <div class="lbl">Chain</div>
      </div>
      <div class="palItem" data-tool="erase" title="Erase: tap a node or member (E)">
        <svg viewBox="0 0 22 22" width="22" height="22"><path d="M4 13 L11 6 L18 13 L14 17 H8 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 17 L15 10" stroke="currentColor" stroke-width="2"/></svg>
        <div class="lbl">Erase</div>
      </div>
    </aside>
    <div id="boardWrap">
      <canvas id="board"></canvas>
      <div id="nodePill" class="hidden">
        <button id="pillAnchor" title="Anchor: fix this node to the world so it never moves">Anchor</button>
        <button id="pillWeld" title="Weld: members meeting here keep their angles (rigid joint)">Weld</button>
        <button id="pillMass" title="Mass: tap to cycle 0.5 / 1 / 2 / 4 kg">1 kg</button>
        <button id="pillDel" class="danger" title="Delete this node and its members">Del</button>
      </div>
    </div>
    <aside id="props">
      <button id="propsClose" title="Close">X</button>
      <div id="propsBody"></div>
    </aside>
  </div>
  <footer id="statusBar"><span id="status">Ready.</span><span id="hint"></span></footer>
</div>
<div id="libModal" class="hidden">
  <div class="modalBox">
    <h3>Builds</h3>
    <p class="hint" id="libHint">Saved on the server - the same list on every device.</p>
    <div id="libList"></div>
    <div class="modalBtns">
      <button id="libOpenFile" title="Open a .json build from this device">Open file...</button>
      <button id="libDownload" title="Download the current build as a .json file">Download current</button>
      <button id="libClose">Close</button>
    </div>
  </div>
</div>
<div id="checkResult" style="display:none"></div>
<script type="module" src="app.js"></script>
</body>
</html>
